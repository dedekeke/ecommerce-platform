<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shell-app</title>
    <!--
      es-module-shims polyfills importmap support for browsers that do not implement it natively.
      Served same-origin from /public to avoid CDN supply-chain risk.
      Must be synchronous (no async/defer) so the shim can intercept module loads
      that Angular native-federation injects via its runtime import map BEFORE
      any <script type="module"> is evaluated.
    -->
    <script src="/es-module-shims.js" crossorigin="anonymous"></script>
    <!--
      Placeholder import map — populated at runtime by angularFederationBridge.ts
      via importShim.addImportMap() so Angular MFE bare specifiers resolve correctly.
    -->
    <script type="importmap">
      { "imports": {} }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
