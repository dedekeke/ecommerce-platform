# Helm values for the official `grafana/loki` chart (single-binary mode for small/medium clusters).
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install loki grafana/loki -f monitoring/loki/loki-values.yaml -n monitoring --create-namespace

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h        # 30 days
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_query_series: 10000
  compactor:
    retention_enabled: true
    delete_request_store: s3
  storage:
    type: s3
    s3:
      region: us-east-1            # placeholder
      bucketnames: ecommerce-loki  # placeholder
    bucketNames:
      chunks: ecommerce-loki
      ruler: ecommerce-loki-ruler
      admin: ecommerce-loki-admin

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 50Gi

# Disable subcharts not needed in SingleBinary mode
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: true
  replicas: 1
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
