apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki-gateway.monitoring.svc.cluster.local
    isDefault: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: zipkin
          matcherRegex: 'traceId=(\w+)'
          name: TraceID
          url: '$${__value.raw}'

  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin.ecommerce.svc.cluster.local:9411
