# SLO burn-rate alerts.
#
# Fast burn = 14.4 x (1 - SLO) over 1h, severity=page.
# Slow burn =  6   x (1 - SLO) over 6h, severity=ticket.
#
# Thresholds derived from monitoring/slos/slos.md. Keep this file in sync
# with that matrix when SLO targets change.
#
# SLI: sum(rate(http_server_requests_seconds_count{application=svc,outcome!="SUCCESS"}[w]))
#      / sum(rate(http_server_requests_seconds_count{application=svc}[w]))
#
# 'application' is the Spring Boot Actuator metric tag (defaults to
# spring.application.name); the Prometheus scrape job also adds 'service'
# but we use 'application' so the same expression works regardless of
# scrape topology.

groups:
  - name: slo-burn-rate
    interval: 30s
    rules:
      # ------- api-gateway (SLO 99.9%, budget 0.001) -------
      - alert: ApiGatewayFastBurn
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{application="api-gateway",outcome!="SUCCESS"}[1h]))
            /
            sum(rate(http_server_requests_seconds_count{application="api-gateway"}[1h]))
          ) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
          service: api-gateway
          slo: availability
          burn_rate: fast
        annotations:
          summary: "api-gateway burning error budget at 14.4x — 30d budget in <2d"
          runbook: docs/OPERATIONS_RUNBOOK.md#api-gateway

      - alert: ApiGatewaySlowBurn
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{application="api-gateway",outcome!="SUCCESS"}[6h]))
            /
            sum(rate(http_server_requests_seconds_count{application="api-gateway"}[6h]))
          ) > (6 * 0.001)
        for: 15m
        labels:
          severity: ticket
          service: api-gateway
          slo: availability
          burn_rate: slow
        annotations:
          summary: "api-gateway chronic budget burn at 6x — open ticket"
          runbook: docs/OPERATIONS_RUNBOOK.md#api-gateway

