spring:
  application:
    name: api-gateway

  # Enable virtual threads for reactive Spring Cloud Gateway
  threads:
    virtual:
      enabled: true

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}

      client:
        provider:
          auth0:
            issuer-uri: ${AUTH0_ISSUER_URI}
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope: openid,profile,email

  # Cloud Configuration
  cloud:
    # Make Config Server optional (we'll enable it later when Config Server is ready)
    config:
      enabled: false
      import-check:
        enabled: false

    # Gateway Configuration
    gateway:
      # Discovery Locator - automatically create routes from Eureka services
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:5000"
              - "http://localhost:5001"
              - "http://localhost:5002"
              - "http://localhost:5003"
              - "http://localhost:4200"
              - "http://localhost:4201"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # Default filters applied to all routes
      default-filters:
        - TokenRelay
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false

      # ------------------------------------------------------------------
      # Route configuration policy (see docs/API_VERSIONING.md):
      #   - Unversioned routes (`/api/<resource>/**`) remain active for legacy
      #     clients. They are stamped with a `Deprecation: true` and a
      #     `Sunset:` response header so callers can migrate at their own pace.
      #   - Versioned routes (`/api/v1/<resource>/**`) carry no deprecation
      #     header and are the canonical entry-point for new integrations.
      #     They strip the `/v1` prefix before forwarding so each backend
      #     service stays unaware of the gateway's versioning policy.
      #   - Deprecation date is centrally controlled by ${API_DEPRECATION_SUNSET}
      #     so the platform can roll the date forward in one place.
      # ------------------------------------------------------------------
      routes:
        # ---------- User Service ----------
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Sunset, ${API_DEPRECATION_SUNSET:Fri, 30 Apr 2027 23:59:59 GMT}
            - AddResponseHeader=Link, </api/v1/users>; rel="successor-version"
        - id: user-service-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - AddRequestHeader=X-API-Version, v1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1

        # ---------- Product Service ----------
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 200
                redis-rate-limiter.burstCapacity: 400
                redis-rate-limiter.requestedTokens: 1
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Sunset, ${API_DEPRECATION_SUNSET:Fri, 30 Apr 2027 23:59:59 GMT}
            - AddResponseHeader=Link, </api/v1/products>; rel="successor-version"
        - id: product-service-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - AddRequestHeader=X-API-Version, v1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 200
                redis-rate-limiter.burstCapacity: 400
                redis-rate-limiter.requestedTokens: 1

        # ---------- Cart Service ----------
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Sunset, ${API_DEPRECATION_SUNSET:Fri, 30 Apr 2027 23:59:59 GMT}
