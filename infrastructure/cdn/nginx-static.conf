# =============================================================================
# §1.6 nginx config for serving the shell-app + MFE dist/ trees as static
# assets behind a CDN (CloudFront, Cloudflare, Fastly, etc.). The CDN
# origins fetch from this nginx; the cache-control headers below tell the
# CDN how long to keep each asset.
#
# Drop this into /etc/nginx/conf.d/ on the static origin host (or use it
# as a template for a Helm-managed nginx ConfigMap).
# =============================================================================

# -----------------------------------------------------------------------------
# Hashed assets — Vite emits dist/assets/<name>-<hash>.<js|css|svg|woff2|...>
# These are CONTENT-ADDRESSED: the file at /assets/index-abc123.js
# will never have its bytes change, so we mark it immutable for 1 year.
# `immutable` tells the browser not to revalidate even on hard reload.
# -----------------------------------------------------------------------------
map $sent_http_content_type $cache_control_long {
    default                          "public, max-age=31536000, immutable";
}

# -----------------------------------------------------------------------------
# index.html and other root HTML — must NEVER be cached aggressively because
# it is the entry point that references new hashed bundles after each deploy.
# -----------------------------------------------------------------------------
map $sent_http_content_type $cache_control_short {
    default                          "no-store, must-revalidate";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression — pre-compress at build time too via vite-plugin-compression
    # for best CDN behaviour.
    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Default security headers. The CDN should pass these through.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Long-lived hashed assets ----
    location /assets/ {
        access_log off;
        try_files $uri =404;
        add_header Cache-Control $cache_control_long always;
        # CORS for federated MFE consumption from the shell origin.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ---- Federation manifest (also hashed via Vite, but declared explicitly
    # so we don't accidentally cache the WRONG bundle entry) ----
    location = /assets/remoteEntry.js {
        access_log off;
        try_files $uri =404;
        # remoteEntry.js can change at deploy time without filename change
        # for some federation plugins, so cap caching to a short TTL.
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ---- index.html — never cache, always revalidate ----
    location = /index.html {
        add_header Cache-Control $cache_control_short always;
    }

    # ---- SPA fallback — every unknown path serves index.html so React Router
    # can take over. The fallback itself inherits the no-cache header. ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $cache_control_short always;
    }
}
