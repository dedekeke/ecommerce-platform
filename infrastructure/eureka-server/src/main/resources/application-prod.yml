# Production profile overrides (Scalability P1): log-level hardening.
# Eureka Server exposes no Swagger UI; this file exists purely to pin log levels for prod.
# The base profile defaults com.ecommerce.eureka to DEBUG.
logging:
  level:
    root: WARN
    com.ecommerce: INFO
    # Exact-key override: base sets com.ecommerce.eureka: DEBUG,
    # which logback resolves independently of the com.ecommerce ancestor above.
    com.ecommerce.eureka: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
# Distributed-trace sampling — lowered for production (Perf P2).
# Full-rate (1.0) sampling inherited from the base profile floods the single
# Zipkin collector + single-node Elasticsearch backend under load. Env-tunable
# (TRACING_SAMPLING_PROBABILITY_PROD) so ops can retune without a redeploy;
# defaults to 10%. See docs/TRACING_SETUP.md.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY_PROD:0.1}
