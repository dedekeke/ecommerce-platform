# Subchart defaults — overridden by parent umbrella values.
service:
  name: media-service
  port: 8089
image:
  repository: media-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"
replicaCount: 1
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
config:
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  # Prod trace sampling (Perf P2); 10% default, override per env via values.
  TRACING_SAMPLING_PROBABILITY_PROD: "0.1"
  SECURITY_ENABLED: "true"
podDisruptionBudget:
  enabled: true
  minAvailable: 1
