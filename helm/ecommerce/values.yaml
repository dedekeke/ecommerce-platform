# Default umbrella values. Each subchart inherits its values from the matching key here.
# Overridable via -f values-staging.yaml / values-prod.yaml or --set.

# Container registry is environment-driven (project rule: no hardcoded env-specific values).
# CI/deploy renders ${IMAGE_REGISTRY} (default ghcr.io/ecommerce-platform) before `helm upgrade`,
# or pass --set global.imageRegistry=$IMAGE_REGISTRY. Image refs become
# <imageRegistry>/<service>:<imageTag> via the shared `svc.image` helper.
global:
  # Empty by default so an unset registry fails loudly via the svc.image `required` guard
  # instead of silently baking in a placeholder. Must be set at deploy time
  # (--set global.imageRegistry=$IMAGE_REGISTRY).
  imageRegistry: ""
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  namespace: ecommerce
  ingress:
    enabled: true
    # Base domain is environment-driven and has no default; it MUST be supplied at deploy time
    # (--set global.ingress.host=$BASE_DOMAIN). An empty value fails the `required` guard in
    # templates/ingress.yaml so a release never ships a placeholder/literal host.
    host: ""
    className: nginx
    # ACME e-mail for the cert-manager ClusterIssuer is env-driven (${ACME_EMAIL}); see k8s/cert-manager.
    certManager:
      clusterIssuer: letsencrypt-prod
    tls:
      enabled: true
      secretName: ecommerce-tls

# Shared subchart defaults, used only as a YAML anchor (this key is not a subchart
# name, so Helm's value routing ignores it). Defined here — rather than on
# user-service as before — so per-service keys like `hpa` can be set on individual
# services without leaking through `<<: *svc-defaults` to unrelated services.
commonServiceDefaults: &svc-defaults
  enabled: true
  replicaCount: 1
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits:   { memory: "512Mi", cpu: "500m" }

api-gateway:
  enabled: true
  service:
    name: api-gateway
    port: 8080
  image:
    repository: api-gateway
  replicaCount: 1
  resources:
    requests: { memory: "256Mi", cpu: "200m" }
    limits:   { memory: "512Mi", cpu: "500m" }
  # Latency-critical entry point, no DB pool -> CPU HPA, min 2 / max 8 (mirrors kustomize).
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

user-service:
  <<: *svc-defaults
  service:
    name: user-service
    port: 8081
  image:
    repository: user-service
  # PostgreSQL co-tenant -> max pinned to the connection-budget ceiling (2); min 2
  # removes the single-replica SPOF and makes user-service-pdb effective.
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

product-service:
  <<: *svc-defaults
  service: { name: product-service, port: 8082 }
  image: { repository: product-service }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

cart-service:
  <<: *svc-defaults
  service: { name: cart-service, port: 8083 }
  image: { repository: cart-service }
  # PostgreSQL co-tenant -> max pinned to the connection-budget ceiling (2); min 2
  # removes the single-replica SPOF and makes cart-service-pdb effective.
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

order-service:
