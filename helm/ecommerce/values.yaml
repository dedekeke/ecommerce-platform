# Default umbrella values. Each subchart inherits its values from the matching key here.
# Overridable via -f values-staging.yaml / values-prod.yaml or --set.

# Container registry is environment-driven (project rule: no hardcoded env-specific values).
# CI/deploy renders ${IMAGE_REGISTRY} (default ghcr.io/ecommerce-platform) before `helm upgrade`,
# or pass --set global.imageRegistry=$IMAGE_REGISTRY. Image refs become
# <imageRegistry>/<service>:<imageTag> via the shared `svc.image` helper.
global:
  imageRegistry: "ghcr.io/ecommerce-platform"  # override via ${IMAGE_REGISTRY}
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  namespace: ecommerce
  ingress:
    enabled: true
    # Base domain is environment-driven; rendered from ${BASE_DOMAIN} at deploy time
    # (envsubst or --set global.ingress.host=$BASE_DOMAIN). Never hardcode a real domain.
    host: "${BASE_DOMAIN}"
    className: nginx
    # ACME e-mail for the cert-manager ClusterIssuer is env-driven (${ACME_EMAIL}); see k8s/cert-manager.
    certManager:
      clusterIssuer: letsencrypt-prod
    tls:
      enabled: true
      secretName: ecommerce-tls

api-gateway:
  enabled: true
  service:
    name: api-gateway
    port: 8080
  image:
    repository: api-gateway
  replicaCount: 1
  resources:
    requests: { memory: "256Mi", cpu: "200m" }
    limits:   { memory: "512Mi", cpu: "500m" }

user-service: &svc-defaults
  enabled: true
  service:
    name: user-service
    port: 8081
  image:
    repository: user-service
  replicaCount: 1
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits:   { memory: "512Mi", cpu: "500m" }

product-service:
  <<: *svc-defaults
  service: { name: product-service, port: 8082 }
  image: { repository: product-service }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

cart-service:
  <<: *svc-defaults
  service: { name: cart-service, port: 8083 }
  image: { repository: cart-service }

order-service:
  <<: *svc-defaults
  service: { name: order-service, port: 8084 }
  image: { repository: order-service }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

payment-service:
  <<: *svc-defaults
  service: { name: payment-service, port: 8085 }
  image: { repository: payment-service }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

inventory-service:
  <<: *svc-defaults
  service: { name: inventory-service, port: 8086 }
  image: { repository: inventory-service }

notification-service:
  <<: *svc-defaults
  service: { name: notification-service, port: 8087 }
  image: { repository: notification-service }

search-service:
  <<: *svc-defaults
  service: { name: search-service, port: 8088 }
  image: { repository: search-service }

media-service:
  <<: *svc-defaults
  service: { name: media-service, port: 8089 }
  image: { repository: media-service }

promotion-service:
  <<: *svc-defaults
  service: { name: promotion-service, port: 8090 }
  image: { repository: promotion-service }
