apiVersion: v2
name: ecommerce
description: Umbrella chart for the e-commerce platform (11 backend services)
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: api-gateway
    version: 0.1.0
    repository: "file://charts/api-gateway"
    condition: api-gateway.enabled
  - name: user-service
    version: 0.1.0
    repository: "file://charts/user-service"
    condition: user-service.enabled
  - name: product-service
    version: 0.1.0
    repository: "file://charts/product-service"
    condition: product-service.enabled
  - name: cart-service
    version: 0.1.0
    repository: "file://charts/cart-service"
    condition: cart-service.enabled
  - name: order-service
    version: 0.1.0
    repository: "file://charts/order-service"
    condition: order-service.enabled
  - name: payment-service
    version: 0.1.0
    repository: "file://charts/payment-service"
    condition: payment-service.enabled
  - name: inventory-service
    version: 0.1.0
    repository: "file://charts/inventory-service"
    condition: inventory-service.enabled
  - name: notification-service
    version: 0.1.0
    repository: "file://charts/notification-service"
    condition: notification-service.enabled
  - name: search-service
    version: 0.1.0
    repository: "file://charts/search-service"
    condition: search-service.enabled
  - name: media-service
    version: 0.1.0
    repository: "file://charts/media-service"
    condition: media-service.enabled
  - name: promotion-service
    version: 0.1.0
    repository: "file://charts/promotion-service"
    condition: promotion-service.enabled
