{{- if .Values.global.ingress.enabled }}
{{- $ingressHost := required "global.ingress.host is required (set --set global.ingress.host=$BASE_DOMAIN); refusing to deploy a placeholder host" .Values.global.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  labels:
    {{- include "ecommerce.umbrellaLabels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ .Values.global.ingress.certManager.clusterIssuer | default "letsencrypt-prod" | quote }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $ingressHost }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $ingressHost }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shell-app
                port:
                  number: 80
{{- end }}
