global:
  imageTag: staging-latest
  ingress:
    host: "staging.${BASE_DOMAIN}"  # rendered from env at deploy time; never hardcode the real domain

# 1 replica per service in staging
api-gateway: { replicaCount: 1 }
user-service: { replicaCount: 1 }
product-service:
  replicaCount: 1
  hpa: { enabled: false }
order-service:
  replicaCount: 1
  hpa: { enabled: false }
payment-service:
  replicaCount: 1
  hpa: { enabled: false }
