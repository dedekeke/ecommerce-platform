global:
  imageTag: staging-latest
  ingress:
    host: ""  # MUST be supplied at deploy time via --set global.ingress.host=staging.$BASE_DOMAIN; empty value trips the `required` guard in templates/ingress.yaml

# 1 replica per service in staging
api-gateway: { replicaCount: 1 }
user-service: { replicaCount: 1 }
product-service:
  replicaCount: 1
  hpa: { enabled: false }
order-service:
  replicaCount: 1
  hpa: { enabled: false }
payment-service:
  replicaCount: 1
  hpa: { enabled: false }
