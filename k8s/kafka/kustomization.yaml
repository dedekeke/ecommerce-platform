apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

# Kafka broker ACLs. Apply after the broker has an authorizer + SASL enabled and ESO has
# materialised `kafka-secret`. The BOOTSTRAP value is env-driven (render with envsubst):
#   envsubst < kafka-acls-job.yaml | kubectl apply -f -
#   kubectl apply -f kafka-externalsecret.yaml

resources:
  - kafka-externalsecret.yaml
  - kafka-acls-job.yaml
