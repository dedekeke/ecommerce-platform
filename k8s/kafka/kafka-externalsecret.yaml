# Namespaced SecretStore for Kafka: authenticates to Vault with its own least-privilege
# Kubernetes-auth role `eso-kafka` (created by helm/vault/bootstrap.sh), scoped to kv/data/kafka.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-kafka
  namespace: ecommerce
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      caProvider:
        type: Secret
        name: vault-tls
        key: ca.crt
        namespace: vault
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-kafka"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Kafka admin SASL credentials used by the kafka-acls-init Job. Sourced from Vault via ESO.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kafka
    kind: SecretStore
  target:
    name: kafka-secret
    creationPolicy: Owner
  data:
    - secretKey: admin_user
      remoteRef: {key: kafka, property: admin_user}
    - secretKey: admin_password
      remoteRef: {key: kafka, property: admin_password}
