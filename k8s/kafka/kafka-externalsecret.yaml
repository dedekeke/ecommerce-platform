# Kafka admin SASL credentials used by the kafka-acls-init Job. Sourced from Vault via ESO.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-secret
    creationPolicy: Owner
  data:
    - secretKey: admin_user
      remoteRef: {key: kv/data/kafka, property: admin_user}
    - secretKey: admin_password
      remoteRef: {key: kv/data/kafka, property: admin_password}
