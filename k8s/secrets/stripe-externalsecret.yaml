apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stripe-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: stripe-secret
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef: {key: kv/data/stripe, property: api_key}
    - secretKey: webhook_secret
      remoteRef: {key: kv/data/stripe, property: webhook_secret}
