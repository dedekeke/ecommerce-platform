apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply manually after ESO + Vault are installed and seeded:
#   kubectl apply -k k8s/secrets

resources:
  - vault-cluster-secret-store.yaml
  # shared datastore / provider secrets
  - postgres-externalsecret.yaml
  - mysql-externalsecret.yaml
  - mongo-externalsecret.yaml
  - auth0-externalsecret.yaml
  - stripe-externalsecret.yaml
  # per-service least-privilege secrets
  - services
