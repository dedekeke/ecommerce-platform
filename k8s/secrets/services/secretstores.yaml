# Per-service namespaced SecretStores. Each authenticates to Vault with its own
# Kubernetes-auth role `eso-<svc>` (created by helm/vault/bootstrap.sh), giving ESO
# least-privilege access to only that service's Vault paths.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-api-gateway
  namespace: ecommerce
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-api-gateway"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
