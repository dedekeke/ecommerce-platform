# Per-service ExternalSecret (least-privilege). Materialises Secret `api-gateway-secret`
# from this service's dedicated Vault path plus the shared datastore paths it uses.
# The Vault role `eso-api-gateway` (see helm/vault/policies) grants read on exactly these paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-gateway-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-api-gateway
    kind: SecretStore
  target:
    name: api-gateway-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef: {key: kv/data/services/api-gateway, property: encryption_key}
    - secretKey: AUTH0_CLIENT_ID
      remoteRef: {key: kv/data/auth0, property: client_id}
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef: {key: kv/data/auth0, property: client_secret}
