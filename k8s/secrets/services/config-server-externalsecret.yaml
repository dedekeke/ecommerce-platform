# Per-service ExternalSecret (least-privilege). Materialises Secret `config-server-secret`
# from this service's dedicated Vault path plus the shared datastore paths it uses.
# The Vault role `eso-config-server` (see helm/vault/policies) grants read on exactly these paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: config-server-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-config-server
    kind: SecretStore
  target:
    name: config-server-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef: {key: services/config-server, property: encryption_key}
