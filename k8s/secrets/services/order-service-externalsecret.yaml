# Per-service ExternalSecret (least-privilege). Materialises Secret `order-service-secret`
# from this service's dedicated Vault path plus the shared datastore paths it uses.
# The Vault role `eso-order-service` (see helm/vault/policies) grants read on exactly these paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-order-service
    kind: SecretStore
  target:
    name: order-service-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef: {key: services/order-service, property: encryption_key}
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: {key: postgres, property: username}
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: {key: postgres, property: password}
    - secretKey: AUTH0_CLIENT_ID
      remoteRef: {key: auth0, property: client_id}
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef: {key: auth0, property: client_secret}
    # Shared inter-service credential (X-Internal-Service-Token). Lives on a
    # SHARED Vault path so promotion-service (validator) and order-service
    # (caller) always resolve the same value; rotating it in Vault rotates both.
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef: {key: internal, property: service_token}
