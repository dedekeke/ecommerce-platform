# Per-service ExternalSecret (least-privilege). Materialises Secret `inventory-service-secret`
# from this service's dedicated Vault path plus the shared datastore paths it uses.
# The Vault role `eso-inventory-service` (see helm/vault/policies) grants read on exactly these paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: inventory-service-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-inventory-service
    kind: SecretStore
  target:
    name: inventory-service-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef: {key: services/inventory-service, property: encryption_key}
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: {key: postgres, property: username}
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: {key: postgres, property: password}
    - secretKey: AUTH0_CLIENT_ID
      remoteRef: {key: auth0, property: client_id}
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef: {key: auth0, property: client_secret}
