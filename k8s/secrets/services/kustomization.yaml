apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Per-service ExternalSecrets (one Secret `<svc>-secret` per backend service).
# Each maps to a least-privilege Vault role `eso-<svc>` (see helm/vault/policies).

resources:
  - secretstores.yaml
  - api-gateway-externalsecret.yaml
  - user-service-externalsecret.yaml
  - product-service-externalsecret.yaml
  - cart-service-externalsecret.yaml
  - order-service-externalsecret.yaml
  - payment-service-externalsecret.yaml
  - inventory-service-externalsecret.yaml
  - notification-service-externalsecret.yaml
  - search-service-externalsecret.yaml
  - media-service-externalsecret.yaml
  - promotion-service-externalsecret.yaml
  - config-server-externalsecret.yaml
