# Per-service ExternalSecret (least-privilege). Materialises Secret `payment-service-secret`
# from this service's dedicated Vault path plus the shared datastore paths it uses.
# The Vault role `eso-payment-service` (see helm/vault/policies) grants read on exactly these paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-service-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-payment-service
    kind: SecretStore
  target:
    name: payment-service-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef: {key: services/payment-service, property: encryption_key}
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: {key: postgres, property: username}
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: {key: postgres, property: password}
    # Env var names must match what payment-service actually reads (stripe.secret-key
    # -> STRIPE_SECRET_KEY, stripe.webhook-secret -> STRIPE_WEBHOOK_SECRET). The old
    # PAYMENT_GATEWAY_* names were consumed by nothing and left the Stripe secrets
    # unresolved. Vault source paths (stripe/api_key, stripe/webhook_secret) unchanged.
    - secretKey: STRIPE_SECRET_KEY
      remoteRef: {key: stripe, property: api_key}
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: {key: stripe, property: webhook_secret}
    - secretKey: AUTH0_CLIENT_ID
      remoteRef: {key: auth0, property: client_id}
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef: {key: auth0, property: client_secret}
