# Per-service ExternalSecret (least-privilege). Materialises Secret `payment-service-secret`
# from this service's dedicated Vault path plus the shared datastore paths it uses.
# The Vault role `eso-payment-service` (see helm/vault/policies) grants read on exactly these paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-service-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-payment-service
    kind: SecretStore
  target:
    name: payment-service-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef: {key: kv/data/services/payment-service, property: encryption_key}
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: {key: kv/data/postgres, property: username}
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: {key: kv/data/postgres, property: password}
    - secretKey: PAYMENT_GATEWAY_API_KEY
      remoteRef: {key: kv/data/stripe, property: api_key}
    - secretKey: PAYMENT_GATEWAY_WEBHOOK_SECRET
      remoteRef: {key: kv/data/stripe, property: webhook_secret}
    - secretKey: AUTH0_CLIENT_ID
      remoteRef: {key: kv/data/auth0, property: client_id}
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef: {key: kv/data/auth0, property: client_secret}
