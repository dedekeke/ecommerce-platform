# Per-service ExternalSecret (least-privilege). Materialises Secret `media-service-secret`
# from this service's dedicated Vault path plus the shared datastore paths it uses.
# The Vault role `eso-media-service` (see helm/vault/policies) grants read on exactly these paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: media-service-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-media-service
    kind: SecretStore
  target:
    name: media-service-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef: {key: services/media-service, property: encryption_key}
    - secretKey: SPRING_DATA_MONGODB_URI
      remoteRef: {key: mongo, property: uri}
    - secretKey: AUTH0_CLIENT_ID
      remoteRef: {key: auth0, property: client_id}
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef: {key: auth0, property: client_secret}
