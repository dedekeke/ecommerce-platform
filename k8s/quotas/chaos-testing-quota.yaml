apiVersion: v1
kind: ResourceQuota
metadata:
  name: chaos-testing-quota
  namespace: chaos-testing
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: chaos-testing-limits
  namespace: chaos-testing
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
