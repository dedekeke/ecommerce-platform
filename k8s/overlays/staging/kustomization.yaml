apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-staging

resources:
  - ../../base

# Staging-specific image tags. CI replaces these with the actual tag at deploy time.
images:
  - name: ecommerce/api-gateway
    newTag: staging-latest
  - name: ecommerce/user-service
    newTag: staging-latest
  - name: ecommerce/product-service
    newTag: staging-latest
  - name: ecommerce/cart-service
    newTag: staging-latest
  - name: ecommerce/order-service
    newTag: staging-latest
  - name: ecommerce/payment-service
    newTag: staging-latest
  - name: ecommerce/inventory-service
    newTag: staging-latest
  - name: ecommerce/notification-service
    newTag: staging-latest
  - name: ecommerce/search-service
    newTag: staging-latest
  - name: ecommerce/media-service
    newTag: staging-latest
  - name: ecommerce/promotion-service
    newTag: staging-latest

patches:
  # smaller resource requests for staging
  - path: patches/resources-small.yaml
    target:
      kind: Deployment
      labelSelector: tier=backend
  # 1 replica everywhere
  - path: patches/replicas.yaml
    target:
      kind: Deployment

labels:
  - includeSelectors: true
    pairs:
      environment: staging
