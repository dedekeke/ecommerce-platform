apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-prod

resources:
  - ../../base

# Registry is env-driven (${IMAGE_REGISTRY}, default ghcr.io/ecommerce-platform); render via
# `envsubst < kustomization.yaml > /tmp/k.yaml` or CI before `kustomize build`. Production pins
# immutable SemVer tags; CI rewrites newTag at deploy time.
images:
  - name: ecommerce/api-gateway
    newName: ${IMAGE_REGISTRY}/api-gateway
    newTag: 1.0.0
  - name: ecommerce/user-service
    newName: ${IMAGE_REGISTRY}/user-service
    newTag: 1.0.0
  - name: ecommerce/product-service
    newName: ${IMAGE_REGISTRY}/product-service
    newTag: 1.0.0
  - name: ecommerce/cart-service
    newName: ${IMAGE_REGISTRY}/cart-service
    newTag: 1.0.0
  - name: ecommerce/order-service
    newName: ${IMAGE_REGISTRY}/order-service
    newTag: 1.0.0
  - name: ecommerce/payment-service
    newName: ${IMAGE_REGISTRY}/payment-service
    newTag: 1.0.0
  - name: ecommerce/inventory-service
    newName: ${IMAGE_REGISTRY}/inventory-service
    newTag: 1.0.0
  - name: ecommerce/notification-service
    newName: ${IMAGE_REGISTRY}/notification-service
    newTag: 1.0.0
  - name: ecommerce/search-service
    newName: ${IMAGE_REGISTRY}/search-service
    newTag: 1.0.0
  - name: ecommerce/media-service
    newName: ${IMAGE_REGISTRY}/media-service
    newTag: 1.0.0
  - name: ecommerce/promotion-service
    newName: ${IMAGE_REGISTRY}/promotion-service
    newTag: 1.0.0

patches:
  - path: patches/resources-large.yaml
    target:
      kind: Deployment
      labelSelector: tier=backend
  - path: patches/replicas-prod.yaml
    target:
      kind: Deployment
      labelSelector: tier=backend
  # KEDA ScaledObject max-replica caps for production
  - path: scaling/notification-service-maxreplicas.yaml
  - path: scaling/search-service-maxreplicas.yaml
  - path: scaling/order-service-maxreplicas.yaml

labels:
  - includeSelectors: true
    pairs:
      environment: production
