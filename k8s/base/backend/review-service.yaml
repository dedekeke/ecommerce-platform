apiVersion: v1
kind: ConfigMap
metadata:
  name: review-service-config
  namespace: ecommerce
data:
  SPRING_PROFILES_ACTIVE: "prod"
  EUREKA_SERVER_URL: "http://eureka-server:8761/eureka/"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  ORDER_SERVICE_URL: "http://order-service:8084"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  SECURITY_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: ecommerce
  labels:
    app: review-service
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
        tier: backend
    spec:
      containers:
        - name: review-service
          image: ecommerce/review-service:1.0.0
          ports:
            - containerPort: 8093
              name: http
          envFrom:
            - configMapRef:
                name: review-service-config
            - secretRef:
                name: ecommerce-secrets
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+ParallelRefProcEnabled"
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8093
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8093
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: ecommerce
spec:
  type: ClusterIP
  ports:
    - port: 8093
      targetPort: 8093
      name: http
  selector:
    app: review-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: review-service-pdb
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: review-service
