# CPU-based HorizontalPodAutoscalers.
#
# Authority split (see PR "infra/autoscaling-hygiene"):
#   - product-service, api-gateway, cart-service, user-service -> HPA (this file).
#   - order-service, payment-service -> KEDA ScaledObject (k8s/base/scaling/*),
#     which owns a CPU trigger alongside the event/outbox-lag triggers. They were
#     removed from this file to end the dual-autoscaler conflict (two controllers
#     driving one Deployment).
#
# Targets 70% CPU. cart-service / user-service are capped at maxReplicas 2 to stay
# inside the shared-PostgreSQL connection budget (docs/db-connection-budget.md:
# co-tenant ceilings user=2, cart=2). Raising these caps requires bumping
# DB_POOL_SIZE math and POSTGRES_MAX_CONNECTIONS in lockstep.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
# api-gateway: latency-critical entry point (ZGC, no DB pool), so it scales purely
# on CPU with the same burst/cooldown behaviour as product-service.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
# cart-service: PostgreSQL co-tenant. maxReplicas pinned to the connection-budget
# ceiling (2). minReplicas 2 removes the previous single-replica SPOF and makes the
# cart-service-pdb (minAvailable 1) effective. The VPA (Initial mode) only sizes
# resources at pod creation, so it does not fight this CPU HPA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart-service
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# user-service: PostgreSQL co-tenant. maxReplicas pinned to the connection-budget
# ceiling (2). minReplicas 2 removes the single-replica SPOF and makes
# user-service-pdb effective.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
