apiVersion: v1
kind: ConfigMap
metadata:
  name: eureka-server-config
  namespace: ecommerce
data:
  SPRING_PROFILES_ACTIVE: "prod"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: ecommerce
  labels:
    app: eureka-server
    tier: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
        tier: infra
    spec:
      containers:
        - name: eureka-server
          image: ecommerce/eureka-server:1.0.0
          ports:
            - containerPort: 8761
              name: http
          envFrom:
            - configMapRef:
                name: eureka-server-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: ecommerce
spec:
  type: ClusterIP
  ports:
    - port: 8761
      targetPort: 8761
      name: http
  selector:
    app: eureka-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eureka-server-pdb
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: eureka-server
