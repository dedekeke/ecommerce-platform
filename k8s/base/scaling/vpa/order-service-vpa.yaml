apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: order-service-vpa
  namespace: ecommerce
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: order-service
        minAllowed:
          memory: 512Mi
          cpu: 200m
        maxAllowed:
          memory: 4Gi
          cpu: 4
        controlledResources: ["cpu", "memory"]
