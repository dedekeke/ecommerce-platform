apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cart-service-vpa
  namespace: ecommerce
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart-service
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: cart-service
        minAllowed:
          memory: 256Mi
          cpu: 100m
        maxAllowed:
          memory: 2Gi
          cpu: 2
        controlledResources: ["cpu", "memory"]
