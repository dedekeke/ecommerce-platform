# KEDA ScaledObject for order-service — the SINGLE autoscaling authority for this
# Deployment. The CPU HorizontalPodAutoscaler that previously lived in
# k8s/base/hpa.yaml (max 8) was removed to end a dual-autoscaler conflict; its CPU
# behaviour is reproduced by the cpu trigger below so KEDA now owns both the
# event-lag and the CPU dimension.
#
# Scales 2->8 on the max of: saga response event lag (>50 msgs) or 70% CPU.
#
# CONNECTION-BUDGET GUARD: maxReplicaCount 8 REQUIRES PR #103. The 8-replica ceiling
# is only safe with the right-sized Hikari pools + pinned Postgres max_connections
# from PR #103 (docs/db-connection-budget.md: DB_POOL_SIZE 12 x 8 = 96 conns under a
# 200-conn ceiling). order-service on `develop` still hardcodes maximum-pool-size 20,
# so at 8 replicas without #103 this opens 8 x 20 = 160 connections against a shared
# PostgreSQL with no ceiling. The commit that set this to 8 is isolated and labelled
# "REQUIRES #103" — if this branch is merged before #103, drop/revert that commit to
# fall back to the safe ceiling of 4.
#
# minReplicaCount 2 preserves the HA floor the removed HPA guaranteed and keeps
# order-service-pdb (minAvailable 1) effective. Env overlays may cap maxReplicaCount
# lower (prod 4, staging 2).
#
# KEDA quirk (v2.14.0): a cpu trigger combined with `fallback:` is flagged
# "not supported" by CheckFallbackValid, but v2.14.0 swallows that webhook error and
# the runtime fallback path only evaluates External metrics, so fallback still works
# for the kafka triggers and nothing breaks today. Revisit on KEDA upgrade — a future
# release that enforces the check could reject create/update of this object.
#
# Note: at the time of authoring, order-service has no @KafkaListener
# methods (it is a saga orchestrator that currently only produces). The
# triggers below reference the saga response topics (payment.completed /
# payment.failed) that order-service will consume once the orchestrator is
# closed-loop. Until consumers exist, these triggers will report zero lag
# under the registered consumer group and the ScaledObject will hold at
# minReplicaCount, which is the desired behaviour. Adjust topic / group
# names here when listeners are added.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-service-kafka-lag
  namespace: ecommerce
  labels:
    app: order-service
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 8
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: order-service-group
        topic: payment.completed
        lagThreshold: "50"
        offsetResetPolicy: latest
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: order-service-group
        topic: payment.failed
        lagThreshold: "50"
        offsetResetPolicy: latest
