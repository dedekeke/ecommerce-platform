# KEDA ScaledObject for order-service.
# Scales 1->4 when saga response event lag exceeds 50 messages.
#
# Note: at the time of authoring, order-service has no @KafkaListener
# methods (it is a saga orchestrator that currently only produces). The
# triggers below reference the saga response topics (payment.completed /
# payment.failed) that order-service will consume once the orchestrator is
# closed-loop. Until consumers exist, these triggers will report zero lag
# under the registered consumer group and the ScaledObject will hold at
# minReplicaCount, which is the desired behaviour. Adjust topic / group
# names here when listeners are added.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-service-kafka-lag
  namespace: ecommerce
  labels:
    app: order-service
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 4
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: order-service-group
        topic: payment.completed
        lagThreshold: "50"
        offsetResetPolicy: latest
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: order-service-group
        topic: payment.failed
        lagThreshold: "50"
        offsetResetPolicy: latest
