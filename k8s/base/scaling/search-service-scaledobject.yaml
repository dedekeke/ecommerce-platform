# KEDA ScaledObject for search-service.
# Scales 1->4 when product update events back up beyond 100 messages on any
# single topic. The search-service Kafka consumer is responsible for keeping
# the Elasticsearch index in sync with the canonical product catalogue, so
# sustained lag directly translates into stale search results.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: search-service-kafka-lag
  namespace: ecommerce
  labels:
    app: search-service
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 4
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: search-service
        topic: product.created
        lagThreshold: "100"
        offsetResetPolicy: latest
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: search-service
        topic: product.updated
        lagThreshold: "100"
        offsetResetPolicy: latest
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: search-service
        topic: product.deleted
        lagThreshold: "100"
        offsetResetPolicy: latest
