apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-dashboard-mfe
  namespace: ecommerce
  labels:
    app: user-dashboard-mfe
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-dashboard-mfe
  template:
    metadata:
      labels:
        app: user-dashboard-mfe
        tier: frontend
    spec:
      containers:
        - name: user-dashboard-mfe
          image: ecommerce/user-dashboard-mfe:1.0.0
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-dashboard-mfe
  namespace: ecommerce
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: user-dashboard-mfe
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-dashboard-mfe-pdb
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-dashboard-mfe
