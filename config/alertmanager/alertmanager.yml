# Alertmanager Configuration
# Handles alert routing, grouping, and notification delivery

global:
  resolve_timeout: 5m
  # SMTP configuration (for email notifications)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@ecommerce-platform.com'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'

  # Slack webhook URL
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Templates for custom notification formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert distribution
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s        # Wait time before sending first notification
  group_interval: 10s    # Wait time before sending notifications for new alerts in group
  repeat_interval: 12h   # Wait time before resending notification

  # Child routes for specific alert types
  routes:
    # Critical alerts go to PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true  # Also send to default receiver

    # Business metrics alerts go to business team
    - match:
        category: business
      receiver: 'business-team'

    # Infrastructure alerts go to DevOps team
    - match:
        tier: infrastructure
      receiver: 'devops-team'

    # Kafka/messaging alerts
    - match:
        category: messaging
      receiver: 'messaging-team'

# Inhibition rules (suppress certain alerts when others are firing)
inhibit_rules:
  # Inhibit HighErrorRate if ServiceDown is firing
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'HighErrorRate'
    equal: ['service']

  # Inhibit HighMemoryUsage if ServiceDown is firing
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'HighMemoryUsage'
    equal: ['service']

# Notification receivers
receivers:
  # Default receiver (logs only)
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9095/webhook'

  # Critical alerts (PagerDuty + Slack)
  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#alerts-critical'
        title: ':fire: Critical Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  # Business team alerts (Slack + Email)
  - name: 'business-team'
    slack_configs:
      - channel: '#alerts-business'
        title: ':chart_with_upwards_trend: Business Metric Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: 'business-team@ecommerce-platform.com'
        headers:
          Subject: '[Business Alert] {{ .GroupLabels.alertname }}'

  # DevOps team alerts (Slack + Email)
  - name: 'devops-team'
    slack_configs:
      - channel: '#alerts-devops'
        title: ':warning: Infrastructure Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: 'devops@ecommerce-platform.com'
        headers:
          Subject: '[DevOps Alert] {{ .GroupLabels.alertname }}'

  # Messaging/Kafka team alerts
  - name: 'messaging-team'
    slack_configs:
      - channel: '#alerts-messaging'
        title: ':email: Messaging Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: 'messaging-team@ecommerce-platform.com'
        headers:
          Subject: '[Kafka Alert] {{ .GroupLabels.alertname }}'
