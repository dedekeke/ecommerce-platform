# Test Configuration
spring.application.name=search-service-test

# Elasticsearch Test Configuration (will be overridden by Testcontainers)
spring.elasticsearch.uris=http://localhost:9200

# Kafka Test Configuration
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.group-id=search-service-test
spring.kafka.consumer.auto-offset-reset=earliest

# Logging
logging.level.com.ecommerce.searchservice=DEBUG
logging.level.org.springframework.data.elasticsearch=INFO
