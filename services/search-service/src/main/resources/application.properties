# Application Configuration
spring.application.name=search-service
server.port=8089

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200

# Redis Configuration (saga idempotency ledger)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Saga replenishment — Redis dedup TTL in hours
search.replenishment.consumed-event-ttl-hours=${SAGA_CONSUMED_EVENT_TTL_HOURS:24}

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=search-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka producer tuning (applied 2026-04-30, see SCALING_AND_IMPROVEMENTS.md §2.6):
#   search-service publishes deboost/reboost saga events from SearchStockListener.
#   Same batching + compression rationale as the other producers: zstd shrinks
#   payloads ~60–70%, batch+linger improves broker throughput, idempotence
#   prevents duplicates on retry.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=zstd
spring.kafka.producer.batch-size=65536
spring.kafka.producer.linger-ms=5
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.enable.idempotence=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Security Configuration
# Set to false to disable Auth0 for local development
security.enabled=${SECURITY_ENABLED:true}

# OAuth2 Resource Server (Auth0)
auth0.domain=${AUTH0_DOMAIN:dev-example.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://api.ecommerce.com}

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# Feature flags (§4.6) — see docs/FEATURE_FLAGS.md
# Gates the GET /api/search/suggest typeahead endpoint. Defaults to false
# in production; set to true in dev/staging to expose typeahead.
feature.flag.search-typeahead=${FEATURE_FLAG_SEARCH_TYPEAHEAD:false}

# Logging
logging.level.com.ecommerce.searchservice=INFO
logging.level.org.springframework.data.elasticsearch=DEBUG
