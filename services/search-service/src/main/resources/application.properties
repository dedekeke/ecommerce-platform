# Application Configuration
spring.application.name=search-service
server.port=8089

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=search-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Security Configuration
# Set to false to disable Auth0 for local development
security.enabled=${SECURITY_ENABLED:true}

# OAuth2 Resource Server (Auth0)
auth0.domain=${AUTH0_DOMAIN:dev-example.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://api.ecommerce.com}

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# Logging
logging.level.com.ecommerce.searchservice=INFO
logging.level.org.springframework.data.elasticsearch=DEBUG
