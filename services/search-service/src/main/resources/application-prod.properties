# Production profile overrides.
# Swagger / OpenAPI UI disabled in production (kept enabled in dev/local/docker).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Log-level hardening for production (Scalability P1).
# org.springframework.data.elasticsearch is DEBUG in the base profile; pin it for prod.
logging.level.root=WARN
logging.level.com.ecommerce=INFO
logging.level.org.springframework.data.elasticsearch=WARN
