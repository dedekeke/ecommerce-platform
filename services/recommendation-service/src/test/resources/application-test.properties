spring.application.name=recommendation-service

# Disable security in unit / WebMvc tests by default
security.enabled=false

# Mongo URI is overridden by Testcontainers in BaseMongoTest subclasses
spring.data.mongodb.database=recommendation-db-test

# Disable Eureka in tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Cache - tiny in-memory for tests
spring.cache.cache-names=productRecommendations,userRecommendations

# Disable Kafka auto-config in unit tests (consumer tests inject manually)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Auth0 placeholders so @Value doesn't blow up if SecurityConfig is loaded
auth0.domain=test.auth0.com
auth0.audience=https://test.api/

# Logging
logging.level.com.ecommerce.recommendationservice=DEBUG
management.endpoints.web.exposure.include=health,info
