spring:
  application:
    name: order-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    url: ${ORDER_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ${spring.application.name}-hikari
      register-mbeans: true
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    # Producer tuning rationale (applied 2026-04-30, see SCALING_AND_IMPROVEMENTS.md §2.6):
    #   - acks=all + enable.idempotence=true: exactly-once delivery semantics; required
    #     for the transactional outbox so a retry never produces a duplicate event.
    #   - compression-type=zstd: ~60–70% size reduction on JSON payloads, cheaper than
    #     gzip on CPU; reduces broker disk I/O and replication bandwidth.
    #   - batch-size=64KB + linger-ms=5: trades 5ms of latency for batched sends;
    #     drastically improves throughput under burst load (default 16KB batches under-fill).
    #   - buffer-memory=64MB: producer-side send buffer; absorbs short broker stalls
    #     without back-pressuring the application thread.
    #   - max.in.flight.requests.per.connection=5: maximum allowed when idempotence is
    #     enabled; preserves per-partition order while permitting pipelining.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: zstd
      batch-size: 65536
      linger-ms: 5
      buffer-memory: 67108864
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: order-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

  threads:
    virtual:
      enabled: true

# Server Configuration
server:
  port: 8084
  shutdown: graceful
  compression:
    enabled: true

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# gRPC Server Configuration
grpc:
  server:
    port: ${GRPC_ORDER_PORT:9191}
  client:
    # Global client configuration for connection pooling
    GLOBAL:
      enableKeepAlive: true
      keepAliveTime: 30s
      keepAliveTimeout: 10s
      negotiationType: plaintext
      maxInboundMessageSize: 10MB
      # Retry configuration
      enableRetry: true
      maxRetryAttempts: 3
      # Deadline for calls
      deadline: 30s

    cart-service:
      address: ${GRPC_CLIENT_CART_SERVICE}
      negotiation-type: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

    payment-service:
      address: ${GRPC_CLIENT_PAYMENT_SERVICE}
      negotiation-type: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

    inventory-service:
      address: ${GRPC_CLIENT_INVENTORY_SERVICE}
      negotiation-type: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

# Security Configuration
# Set to false to disable Auth0 for local development
security:
  enabled: ${SECURITY_ENABLED}

# OAuth2 Resource Server
auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE}

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: https://${AUTH0_DOMAIN}/
  audiences: ${AUTH0_AUDIENCE}

# Transactional Outbox (polling-based relay)
# - enabled: master switch for the @Scheduled relay; disabled in tests
# - poll-interval-ms: how often the relay claims a batch
# - batch-size: max rows pulled per poll (caps blast radius of stuck events)
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}

# Application-specific configuration
order:
  number:
    prefix: ORD
    year-format: yyyy
  tax:
    rate: 0.08
  shipping:
    base-cost: 5.99
    free-threshold: 50.00
  scheduled:
    abandoned-orders-cron: "0 0 4 * * ?"
    cleanup-old-orders-cron: "0 0 3 * * ?"
    daily-sales-report-cron: "0 0 1 * * ?"
    abandoned-hours-threshold: 24
  # See docs/PARTITIONING.md — archival is the §1.2 hot-table-trim mechanism
  # until row count crosses the 50M partitioning trigger.
  archival:
    enabled: ${ORDER_ARCHIVAL_ENABLED:true}
    cron: ${ORDER_ARCHIVAL_CRON:0 0 4 * * ?}
    cutoff-days: ${ORDER_ARCHIVAL_CUTOFF_DAYS:365}
    batch-size: ${ORDER_ARCHIVAL_BATCH_SIZE:1000}

# §3.6 Subscription / recurring orders
subscription:
  scheduler-enabled: ${SUBSCRIPTION_SCHEDULER_ENABLED:true}
  scheduler-poll-ms: ${SUBSCRIPTION_SCHEDULER_POLL_MS:60000}

# Promotion Service URL
promotion:
  service:
    url: ${PROMOTION_SERVICE_URL}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - io.grpc.StatusRuntimeException
          - org.springframework.web.client.RestClientException
        ignoreExceptions:
          - com.ecommerce.orderservice.exception.OrderNotFoundException
    instances:
      cart-service:
        baseConfig: default
        slidingWindowSize: 10
        waitDurationInOpenState: 20s
      inventory-service:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
      payment-service:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
      promotion-service:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 15s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - io.grpc.StatusRuntimeException
        ignoreExceptions:
          - com.ecommerce.orderservice.exception.OrderNotFoundException
    instances:
      cart-service:
        baseConfig: default
        maxAttempts: 3
      inventory-service:
        baseConfig: default
        maxAttempts: 3
      payment-service:
        baseConfig: default
        maxAttempts: 2
      promotion-service:
        baseConfig: default
        maxAttempts: 3

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      cart-service:
        baseConfig: default
        timeoutDuration: 3s
      inventory-service:
        baseConfig: default
        timeoutDuration: 5s
      payment-service:
        baseConfig: default
        timeoutDuration: 10s
      promotion-service:
        baseConfig: default
        timeoutDuration: 3s

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0ms
    instances:
      cart-service:
        baseConfig: default
        maxConcurrentCalls: 20
      inventory-service:
        baseConfig: default
        maxConcurrentCalls: 30
      payment-service:
        baseConfig: default
        maxConcurrentCalls: 15
      promotion-service:
        baseConfig: default
        maxConcurrentCalls: 20

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  show-actuator: false

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.orderservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Scheduled Tasks Configuration is under the order: key above

---
# Local Profile
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.ecommerce.orderservice: DEBUG

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.ecommerce.orderservice: INFO
