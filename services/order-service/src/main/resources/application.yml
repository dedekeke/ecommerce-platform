spring:
  application:
    name: order-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: order-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

  threads:
    virtual:
      enabled: true

# Server Configuration
server:
  port: ${SERVER_PORT}
  shutdown: graceful
  compression:
    enabled: true

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# gRPC Server Configuration
grpc:
  server:
    port: ${GRPC_SERVER_PORT}
  client:
    # Global client configuration for connection pooling
    GLOBAL:
      enableKeepAlive: true
      keepAliveTime: 30s
      keepAliveTimeout: 10s
      negotiationType: plaintext
      maxInboundMessageSize: 10MB
      # Retry configuration
      enableRetry: true
      maxRetryAttempts: 3
      # Deadline for calls
      deadline: 30s

    cart-service:
      address: ${GRPC_CLIENT_CART_SERVICE}
      negotiation-type: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

    payment-service:
      address: ${GRPC_CLIENT_PAYMENT_SERVICE}
      negotiation-type: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

    inventory-service:
      address: ${GRPC_CLIENT_INVENTORY_SERVICE}
      negotiation-type: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

# Security Configuration
# Set to false to disable Auth0 for local development
security:
  enabled: ${SECURITY_ENABLED}

# OAuth2 Resource Server
auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE}

# Application-specific configuration
order:
  number:
    prefix: ORD
    year-format: yyyy
  tax:
    rate: 0.08
  shipping:
    base-cost: 5.99
    free-threshold: 50.00
  scheduled:
    abandoned-orders-cron: "0 0 4 * * ?"
    cleanup-old-orders-cron: "0 0 3 * * ?"
    daily-sales-report-cron: "0 0 1 * * ?"
    abandoned-hours-threshold: 24

# Promotion Service URL
promotion:
  service:
    url: ${PROMOTION_SERVICE_URL}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - io.grpc.StatusRuntimeException
          - org.springframework.web.client.RestClientException
        ignoreExceptions:
          - com.ecommerce.orderservice.exception.OrderNotFoundException
    instances:
      cart-service:
        baseConfig: default
        slidingWindowSize: 10
        waitDurationInOpenState: 20s
      inventory-service:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
      payment-service:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
      promotion-service:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 15s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - io.grpc.StatusRuntimeException
        ignoreExceptions:
          - com.ecommerce.orderservice.exception.OrderNotFoundException
    instances:
      cart-service:
        baseConfig: default
        maxAttempts: 3
      inventory-service:
        baseConfig: default
        maxAttempts: 3
      payment-service:
        baseConfig: default
        maxAttempts: 2
      promotion-service:
        baseConfig: default
        maxAttempts: 3

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      cart-service:
        baseConfig: default
        timeoutDuration: 3s
      inventory-service:
        baseConfig: default
        timeoutDuration: 5s
      payment-service:
        baseConfig: default
        timeoutDuration: 10s
      promotion-service:
        baseConfig: default
        timeoutDuration: 3s

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0ms
    instances:
      cart-service:
        baseConfig: default
        maxConcurrentCalls: 20
      inventory-service:
        baseConfig: default
        maxConcurrentCalls: 30
      payment-service:
        baseConfig: default
        maxConcurrentCalls: 15
      promotion-service:
        baseConfig: default
        maxConcurrentCalls: 20

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.orderservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Scheduled Tasks Configuration is under the order: key above

---
# Local Profile
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.ecommerce.orderservice: DEBUG

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.ecommerce.orderservice: INFO
