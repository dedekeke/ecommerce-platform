# Test Configuration
spring.application.name=media-service-test
server.port=0

# MongoDB Test Configuration (will be overridden by Testcontainers)
spring.data.mongodb.uri=mongodb://localhost:27017/mediadb-test

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Configuration (use temp directory for tests)
media.storage.location=${java.io.tmpdir}/media-service-test/storage
media.storage.thumbnails-location=${java.io.tmpdir}/media-service-test/storage/thumbnails
media.allowed-file-types=image/jpeg,image/png,image/gif,image/webp
media.thumbnail.width=200
media.thumbnail.height=200

# Disable Eureka in tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Disable security in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging
logging.level.com.ecommerce.mediaservice=DEBUG
