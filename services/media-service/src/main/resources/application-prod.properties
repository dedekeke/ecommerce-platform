# Production profile overrides.
# Swagger / OpenAPI UI disabled in production (kept enabled in dev/local/docker).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Log-level hardening for production (Scalability P1).
logging.level.root=WARN
logging.level.com.ecommerce=INFO
# Exact-key override: base sets com.ecommerce.mediaservice=DEBUG, resolved
# independently of the com.ecommerce ancestor above.
logging.level.com.ecommerce.mediaservice=INFO

# Distributed-trace sampling — lowered for production (Perf P2).
# Full-rate (1.0) sampling from the base profile floods the single Zipkin +
# single-node Elasticsearch backend under load. Env-tunable; defaults to 10%.
# See docs/TRACING_SETUP.md.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY_PROD:0.1}
