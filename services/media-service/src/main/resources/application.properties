# Application Configuration
spring.application.name=media-service
server.port=8089

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/mediadb
spring.data.mongodb.auto-index-creation=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Configuration
media.storage.location=./storage
media.storage.thumbnails-location=./storage/thumbnails
media.allowed-file-types=image/jpeg,image/png,image/gif,image/webp,image/svg+xml
media.thumbnail.width=200
media.thumbnail.height=200

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Zipkin Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Security Configuration
# Set to false to disable Auth0 for local development
security.enabled=${SECURITY_ENABLED:true}

# OAuth2 Resource Server (Auth0)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-example.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://api.ecommerce.com}

# Auth0 Configuration
auth0.domain=${AUTH0_DOMAIN:dev-example.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://api.ecommerce.com}

# Logging
logging.level.com.ecommerce.mediaservice=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
