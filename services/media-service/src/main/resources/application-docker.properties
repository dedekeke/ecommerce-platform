# Docker Profile Configuration
spring.application.name=media-service
server.port=8089

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://admin:admin123@mongodb:27017/mediadb?authSource=admin
spring.data.mongodb.auto-index-creation=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Configuration
media.storage.location=/app/storage
media.storage.thumbnails-location=/app/storage/thumbnails
media.allowed-file-types=image/jpeg,image/png,image/gif,image/webp,image/svg+xml
media.thumbnail.width=200
media.thumbnail.height=200

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=media-service

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Zipkin Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# OAuth2 Resource Server (Auth0)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

# Logging
logging.level.com.ecommerce.mediaservice=INFO
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
