spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none

  # No broker in tests: don't auto-start listeners and fail producer sends fast
  # instead of blocking on the 60s topic-metadata timeout.
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 1000
        default.api.timeout.ms: 1000
    producer:
      properties:
        max.block.ms: 500
        request.timeout.ms: 500
        delivery.timeout.ms: 1000
        retries: 0

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false

security:
  enabled: false

auth0:
  domain: test-tenant.auth0.com
  audience: test-audience

# Disable the gRPC server in tests to avoid 'Address already in use' on the
# fixed port when multiple @SpringBootTest contexts coexist.
grpc:
  server:
    port: -1

# Defaults for env placeholders referenced by application.yml so the
# SpringBootTest context can stand up without real infra.
SECURITY_ENABLED: "false"
AUTH0_DOMAIN: test-tenant.auth0.com
AUTH0_AUDIENCE: test-audience
PROMOTION_DB_URL: jdbc:h2:mem:testdb
DB_USERNAME: sa
DB_PASSWORD: ""
SPRING_DATA_REDIS_HOST: localhost
SPRING_DATA_REDIS_PORT: "6379"
EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka
MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://localhost:9411/api/v2/spans
SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

logging:
  level:
    root: WARN
    com.ecommerce.promotionservice: DEBUG
