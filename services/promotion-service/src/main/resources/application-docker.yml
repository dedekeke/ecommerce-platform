spring:
  datasource:
    url: jdbc:mysql://mysql:3306/promotiondb
  data:
    redis:
      host: redis
      port: 6379
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

logging:
  level:
    root: INFO
    com.ecommerce.promotionservice: INFO
    org.hibernate.SQL: INFO
