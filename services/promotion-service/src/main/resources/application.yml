spring:
  application:
    name: promotion-service

  datasource:
    url: ${PROMOTION_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Env-overridable pool (docs/db-connection-budget.md); tune without rebuild.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ${spring.application.name}-hikari
      register-mbeans: true
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      timeout: 60000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 1800000
      cache-null-values: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/

  cloud:
    config:
      enabled: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Producer tuning rationale (applied 2026-04-30, see SCALING_AND_IMPROVEMENTS.md §2.6):
    #   - acks=all + enable.idempotence=true: exactly-once delivery semantics.
    #   - compression-type=zstd: ~60–70% size reduction on JSON payloads.
    #   - batch-size=64KB + linger-ms=5: improves throughput under burst load.
    #   - buffer-memory=64MB: absorbs short broker stalls without back-pressure.
    #   - max.in.flight.requests.per.connection=5: max allowed with idempotence on.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: zstd
      batch-size: 65536
      linger-ms: 5
      buffer-memory: 67108864
      properties:
        spring.json.add.type.headers: false
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true

server:
  port: 8091
  compression:
    enabled: true
  http2:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.ecommerce.promotionservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

security:
  enabled: ${SECURITY_ENABLED}
  # Shared secret proving a caller is a trusted platform service (currently only
  # order-service's checkout saga). Guards POST /api/promotions/apply, which
  # increments usage counters and must never be reachable from a browser.
  # REQUIRED when security.enabled=true — the app fails fast at boot otherwise.
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}

# Inter-service lookup of user contact details (per-user promotion targeting).
user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8085}
    connect-timeout-ms: ${USER_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${USER_SERVICE_READ_TIMEOUT_MS:3000}

# Multi-currency rate refresh (§3.5). The job is feature-flagged OFF by default
# (FEATURE_FLAG_CURRENCY_RATE_REFRESH); set the URL + flag to enable live refresh.
currency:
  rate:
    api-url: ${CURRENCY_RATE_API_URL:}
    refresh-cron: ${CURRENCY_RATE_REFRESH_CRON:0 0 * * * *}
    connect-timeout-ms: ${CURRENCY_RATE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CURRENCY_RATE_READ_TIMEOUT_MS:5000}

feature:
  flag:
    currency-rate-refresh: ${FEATURE_FLAG_CURRENCY_RATE_REFRESH:false}


auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE}
