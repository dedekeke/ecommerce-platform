spring:
  application:
    name: payment-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ${spring.application.name}-hikari
      register-mbeans: true
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    # Producer tuning rationale (applied 2026-04-30, see SCALING_AND_IMPROVEMENTS.md §2.6):
    #   - acks=all + enable.idempotence=true: exactly-once delivery semantics; required
    #     for the transactional outbox so a retry never produces a duplicate event.
    #   - compression-type=zstd: ~60–70% size reduction on JSON payloads, cheaper than
    #     gzip on CPU; reduces broker disk I/O and replication bandwidth.
    #   - batch-size=64KB + linger-ms=5: trades 5ms of latency for batched sends;
    #     drastically improves throughput under burst load (default 16KB batches under-fill).
    #   - buffer-memory=64MB: producer-side send buffer; absorbs short broker stalls
    #     without back-pressuring the application thread.
    #   - max.in.flight.requests.per.connection=5: maximum allowed when idempotence is
    #     enabled; preserves per-partition order while permitting pipelining.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: zstd
      batch-size: 65536
      linger-ms: 5
      buffer-memory: 67108864
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: payment-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

  threads:
    virtual:
      enabled: true

# Payment provider selection: 'mock' (default) or 'stripe'
payment:
  provider: ${PAYMENT_PROVIDER:mock}

# Stripe configuration (only used when payment.provider=stripe).
# The secret key MUST be supplied via the STRIPE_SECRET_KEY env var; never hardcode or commit it.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  api-base: ${STRIPE_API_BASE:}

# Server Configuration
server:
  port: 8085
  shutdown: graceful
  compression:
    enabled: true

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# gRPC Server Configuration
grpc:
  server:
    port: ${GRPC_PAYMENT_PORT:9192}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}
  prometheus:
    metrics:
      export:
        enabled: true

# Security Configuration
# Set to false to disable Auth0 for local development
security:
  enabled: ${SECURITY_ENABLED}

# OAuth2 Resource Server
auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE}

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: https://${AUTH0_DOMAIN}/
  audiences: ${AUTH0_AUDIENCE}

# Transactional Outbox (polling-based relay)
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}

# Resilience4j Configuration for external payment gateway calls
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
          - org.springframework.web.client.RestClientException
    instances:
      payment-gateway:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 30
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 120s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 10s
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      payment-gateway:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 2s

  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      payment-gateway:
        baseConfig: default
        timeoutDuration: 30s

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0ms
    instances:
      payment-gateway:
        baseConfig: default
        maxConcurrentCalls: 10

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  show-actuator: false

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.paymentservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# Local Profile
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.ecommerce.paymentservice: DEBUG

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.ecommerce.paymentservice: INFO
