server:
  port: 8087

spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    # Producer tuning rationale (applied 2026-04-30, see SCALING_AND_IMPROVEMENTS.md §2.6):
    #   notification-service publishes admin-notified / stock-back saga events from
    #   StockAlertListener. Throughput is modest but the same batching + compression
    #   benefits apply: smaller broker footprint and idempotent retries.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      compression-type: zstd
      batch-size: 65536
      linger-ms: 5
      buffer-memory: 67108864
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Bound timeouts so a stalled SMTP peer can't hang the sending thread
          # (and, via the retry scheduler, the whole @Scheduled pipeline) forever.
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
        transport:
          protocol: smtp
    default-encoding: UTF-8

  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Notification Service Configuration
notification:
  retry:
    max-attempts: 3
    initial-delay-minutes: 1
  sms:
    provider: ${SMS_PROVIDER}
    api-key: ${SMS_API_KEY}
    api-secret: ${SMS_API_SECRET}
  email:
    from: ${EMAIL_FROM}
    from-name: ${EMAIL_FROM_NAME}

# Async Configuration
async:
  core-pool-size: 5
  max-pool-size: 10
  queue-capacity: 100

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.notificationservice: DEBUG
    org.springframework.kafka: INFO
    org.springframework.mail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management and Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  show-actuator: false

# Security Configuration
# Set to false to disable Auth0 for local development
security:
  enabled: ${SECURITY_ENABLED}

# OAuth2 Resource Server
auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE}
