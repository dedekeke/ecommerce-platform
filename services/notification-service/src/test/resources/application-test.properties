# Test Configuration
spring.application.name=notification-service

# MongoDB Test Configuration (will be overridden by Testcontainers)
spring.data.mongodb.database=notificationdb-test

# Kafka Test Configuration
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.group-id=notification-service-test
spring.kafka.consumer.auto-offset-reset=earliest

# Email Configuration (Mock mode for tests)
notification.email.enabled=false
notification.email.from=test@ecommerce.com

# SMS Configuration (Mock mode for tests)
notification.sms.enabled=false
notification.sms.provider=twilio-mock

# Async Configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4

# Logging
logging.level.com.ecommerce.notificationservice=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.kafka=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
