spring:
  application:
    name: inventory-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    url: ${INVENTORY_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ${spring.application.name}-hikari
      register-mbeans: true
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    # Producer tuning rationale (applied 2026-04-30, see SCALING_AND_IMPROVEMENTS.md §2.6):
    #   - acks=all + enable.idempotence=true: exactly-once delivery semantics; required
    #     for the transactional outbox so a retry never produces a duplicate event.
    #   - compression-type=zstd: ~60–70% size reduction on JSON payloads, cheaper than
    #     gzip on CPU; reduces broker disk I/O and replication bandwidth.
    #   - batch-size=64KB + linger-ms=5: trades 5ms of latency for batched sends;
    #     drastically improves throughput under burst load (default 16KB batches under-fill).
    #   - buffer-memory=64MB: producer-side send buffer; absorbs short broker stalls
    #     without back-pressuring the application thread.
    #   - max.in.flight.requests.per.connection=5: maximum allowed when idempotence is
    #     enabled; preserves per-partition order while permitting pipelining.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: zstd
      batch-size: 65536
      linger-ms: 5
      buffer-memory: 67108864
      properties:
        spring.json.add.type.headers: false
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
    consumer:
      group-id: inventory-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/
          audiences: ${AUTH0_AUDIENCE}

security:
  enabled: ${SECURITY_ENABLED}

auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE}

server:
  port: 8086

grpc:
  server:
    port: ${GRPC_INVENTORY_PORT:9193}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  level:
    root: INFO
    com.ecommerce.inventoryservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

inventory:
  reservation:
    default-expiration-minutes: 15
  scheduled:
    expired-reservations-cron: "0 */5 * * * *"  # Every 5 minutes
    cleanup-old-reservations-cron: "0 0 2 * * *"  # Daily at 2 AM
    cleanup-days-threshold: 90  # Delete reservations older than 90 days
    restock-alert-cron: "0 0 6 * * ?"  # Daily at 6 AM
  sse:
    timeout-ms: ${INVENTORY_SSE_TIMEOUT_MS:30000}
    heartbeat-interval-ms: ${INVENTORY_SSE_HEARTBEAT_MS:15000}

# Transactional Outbox (polling-based relay)
# - enabled: master switch for the @Scheduled relay; disabled in tests
# - poll-interval-ms: how often the relay claims a batch
# - batch-size: max rows pulled per poll (caps blast radius of stuck events)
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
