# Test profile config — keeps tests deterministic.
# - Outbox relay is disabled so tests drive `relay()` synchronously when needed.
# - Auth0 placeholders satisfied so SpringBootTest contexts can load.
spring:
  datasource:
    url: jdbc:h2:mem:inventory-service-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: false
    # No broker in tests: fail producer sends fast instead of blocking on the
    # default 60s max.block.ms so fire-and-forget event publishing doesn't
    # stall the suite.
    producer:
      properties:
        max.block.ms: 500
        request.timeout.ms: 500
        delivery.timeout.ms: 1000
        retries: 0

outbox:
  relay:
    enabled: false
    poll-interval-ms: 500
    batch-size: 100

# Disable the gRPC server in tests: no inventory test exercises gRPC serving,
# and a fixed port collides when multiple @SpringBootTest contexts coexist.
grpc:
  server:
    port: -1

security:
  enabled: false

auth0:
  domain: test-tenant.auth0.com
  audience: test-audience

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Default values for env placeholders so SpringBootTest can stand up the
# context without real infra.
SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
INVENTORY_DB_URL: jdbc:h2:mem:inventory-service-test
POSTGRES_USER: sa
POSTGRES_PASSWORD: ""
SPRING_PROFILES_ACTIVE: test
EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka
ZIPKIN_ENDPOINT: http://localhost:9411/api/v2/spans
SECURITY_ENABLED: "false"
AUTH0_DOMAIN: test-tenant.auth0.com
AUTH0_AUDIENCE: test-audience
