spring:
  application:
    name: product-service

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/productdb}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Env-overridable pool (docs/db-connection-budget.md); tune without rebuild.
      # Read-heavy but fronted by Redis + Caffeine caches, so a modest pool suffices.
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ${spring.application.name}-hikari
      register-mbeans: true
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: productdb

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Producer tuning rationale (applied 2026-04-30, see SCALING_AND_IMPROVEMENTS.md §2.6):
    #   - acks=all + enable.idempotence=true: exactly-once delivery semantics.
    #   - compression-type=zstd: ~60–70% size reduction on JSON payloads.
    #   - batch-size=64KB + linger-ms=5: improves throughput under burst load.
    #   - buffer-memory=64MB: absorbs short broker stalls without back-pressure.
    #   - max.in.flight.requests.per.connection=5: max allowed with idempotence on.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: zstd
      batch-size: 65536
      linger-ms: 5
      buffer-memory: 67108864
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  threads:
    virtual:
      enabled: true

# Server Configuration
server:
  port: 8082

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.ecommerce.productservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Security Configuration
# Defaults to true (secure-by-default). Override with SECURITY_ENABLED=false for local development only.
security:
  enabled: ${SECURITY_ENABLED:true}

# Auth0 Configuration
auth0:
  domain: ${AUTH0_DOMAIN:dev-vjhkmx73y28ucgcb.us.auth0.com}
  audience: ${AUTH0_AUDIENCE:https://api.ecommerce-platform.com}

# Disable gRPC (product-service uses REST only)
grpc:
  server:
    port: -1  # Disable gRPC server
