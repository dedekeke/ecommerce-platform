# Production profile overrides.
# Swagger / OpenAPI UI is disabled in production (kept enabled in dev/local/docker).
# See k8s base ConfigMaps + helm values: SPRING_PROFILES_ACTIVE=prod.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Log-level hardening for production (Scalability P1).
# Silences verbose SQL / parameter-binding logging inherited from the base profile.
logging:
  level:
    root: WARN
    com.ecommerce: INFO
    # Exact-key override: logback applies levels per exact logger name, so the
    # base profile's com.ecommerce.productservice: DEBUG is NOT lowered by the
    # com.ecommerce ancestor above and must be pinned explicitly.
    com.ecommerce.productservice: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
# Distributed-trace sampling — lowered for production (Perf P2).
# Full-rate (1.0) sampling inherited from the base profile floods the single
# Zipkin collector + single-node Elasticsearch backend under load. Env-tunable
# (TRACING_SAMPLING_PROBABILITY_PROD) so ops can retune without a redeploy;
# defaults to 10%. See docs/TRACING_SETUP.md.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY_PROD:0.1}
