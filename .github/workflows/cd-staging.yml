name: CD - Staging

# Builds and pushes images for every backend service + frontend, then helm-upgrades the
# staging release. Triggered on merge to develop.

on:
  push:
    branches: [ develop ]

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io                   # placeholder
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce
  K8S_NAMESPACE: ecommerce-staging

jobs:
  build-and-push-backend:
    name: Build & push backend ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - inventory-service
          - notification-service
          - search-service
          - media-service
          - promotion-service
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Maven package
        run: mvn -B -ntp clean package -DskipTests -pl services/${{ matrix.service }} -am || \
             mvn -B -ntp clean package -DskipTests -pl infrastructure/${{ matrix.service }} -am
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:staging-latest

  build-and-push-frontend:
    name: Build & push frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - shell-app
          - admin-dashboard-mfe
          - cart-mfe
          - checkout-mfe
          - product-catalog-mfe
          - user-dashboard-mfe
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json }
      - run: npm ci || npm install
        working-directory: frontend/${{ matrix.app }}
      - run: npm run build
        working-directory: frontend/${{ matrix.app }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: frontend/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:staging-latest

  deploy:
    name: Helm upgrade (staging)
    needs: [ build-and-push-backend, build-and-push-frontend ]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Helm upgrade
        run: |
          helm upgrade --install ecommerce ./helm/ecommerce \
            -f helm/ecommerce/values-staging.yaml \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set global.imageTag=staging-${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace \
            --wait --timeout 10m
      - name: Smoke test
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deploy/api-gateway --timeout=5m
