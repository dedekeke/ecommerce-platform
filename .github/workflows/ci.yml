name: CI

# Final safety net — runs only on push to master (post-merge from develop).
# Day-to-day verification is done locally via `scripts/ci-local.sh`.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'k8s/**'
      - 'helm/**'
      - 'monitoring/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22.12.0"

jobs:
  # Detect which areas changed so we can skip backend/frontend selectively.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'common-library/**'
              - 'infrastructure/**'
              - 'pom.xml'
            frontend:
              - 'frontend/**'
            infra:
              - 'k8s/**'
              - 'helm/**'
              - 'docker-compose*.yml'
              - 'Dockerfile*'

  backend-build-test:
    name: Backend build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Build (skip tests)
        run: mvn -B -ntp clean install -DskipTests
      - name: Unit tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - shell-app
          - product-catalog-mfe
          - cart-mfe
          - checkout-mfe
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present -- --run

  angular-frontend:
    name: Angular ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - user-dashboard-mfe
          - admin-dashboard-mfe
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress

  lint-infra:
    name: Lint infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Kustomize render
        run: |
          kubectl kustomize k8s/base > /tmp/base.yaml
          kubectl kustomize k8s/overlays/staging > /tmp/staging.yaml
          kubectl kustomize k8s/overlays/production > /tmp/prod.yaml
      - run: helm lint ./helm/ecommerce
