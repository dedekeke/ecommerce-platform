name: CI

# Runs on every PR. Builds + tests backend + all 6 frontends, lints, and triggers
# OWASP Dependency-Check. Image build is in cd-* workflows, not here.

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ feature/**, fix/** ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------
  # Backend: single root build (preferred — common-library + Maven reactor).
  # ------------------------------------------------------------------
  backend-build-test:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Build (skip tests)
        run: mvn -B -ntp clean install -DskipTests
      - name: Unit tests
        run: mvn -B -ntp test
      - name: Integration tests
        run: mvn -B -ntp verify -P integration-tests
      - name: Coverage report
        run: mvn -B -ntp jacoco:report
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'

  # ------------------------------------------------------------------
  # Frontend: per-MFE matrix. Tests + lint.
  # ------------------------------------------------------------------
  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - shell-app
          - admin-dashboard-mfe
          - cart-mfe
          - checkout-mfe
          - product-catalog-mfe
          - user-dashboard-mfe
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present -- --run
      - name: Build
        run: npm run build --if-present

  # ------------------------------------------------------------------
  # Security: OWASP Dependency-Check (Java) + npm audit (frontends).
  # ------------------------------------------------------------------
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: OWASP Dependency-Check
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8 -DskipTests
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.html'

  # ------------------------------------------------------------------
  # Lint: shell scripts, YAML, kustomize, helm.
  # ------------------------------------------------------------------
  lint-infra:
    name: Lint infra (yaml, kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Kustomize render
        run: |
          kubectl kustomize k8s/base > /tmp/base.yaml
          kubectl kustomize k8s/overlays/staging > /tmp/staging.yaml
          kubectl kustomize k8s/overlays/production > /tmp/prod.yaml
      - name: Helm lint
        uses: azure/setup-helm@v4
      - run: helm lint ./helm/ecommerce
