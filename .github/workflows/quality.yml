name: Quality

# Pre-merge quality gate for the develop integration branch.
# Backend build + tests (JaCoCo), OWASP dependency-check gate, and every
# micro-frontend test suite. Mirror this locally with `scripts/ci-local.sh`.

on:
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'k8s/**'
      - 'helm/**'
      - 'monitoring/**'
  push:
    branches: [ develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'k8s/**'
      - 'helm/**'
      - 'monitoring/**'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22.12.0"

jobs:
  # ---- Backend: build + unit tests with JaCoCo coverage ----
  backend:
    name: Backend build, test & coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Build (skip tests)
        run: mvn -B -ntp clean install -DskipTests
      # JaCoCo prepare-agent + report are bound in the parent pom pluginManagement,
      # so `test` already produces target/site/jacoco per module.
      - name: Unit tests + JaCoCo
        run: mvn -B -ntp test
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
          retention-days: 7

  # ---- Security: OWASP dependency-check gate (failBuildOnCVSS=7.0 from pom) ----
  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Cache the NVD database between runs so the gate stays fast.
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-
      # NVD_API_KEY is optional but strongly recommended to avoid rate limiting.
      # Add it under Settings > Secrets and variables > Actions. No token in YAML.
      - name: Run dependency-check (-Psecurity verify, CVSS >= 7.0 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp -Psecurity -DskipTests verify \
            ${NVD_API_KEY:+-Dnvd.api.key=$NVD_API_KEY}
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.sarif
          if-no-files-found: ignore
          retention-days: 14

  # ---- Frontend: run every MFE's test suite (matrix per app) ----
  # React/Vite MFEs use vitest; Angular MFEs use ng test (ChromeHeadless).
  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: shell-app,            framework: react }
          - { app: product-catalog-mfe,  framework: react }
          - { app: cart-mfe,             framework: react }
          - { app: checkout-mfe,         framework: react }
          - { app: user-dashboard-mfe,   framework: angular }
          - { app: admin-dashboard-mfe,  framework: angular }
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package.json
      # Lockfiles are gitignored in this repo, so fall back to `npm install`.
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint --if-present
      - name: Test (React / vitest)
        if: matrix.framework == 'react'
        run: npm test --if-present -- --run
      - name: Test (Angular / ng)
        if: matrix.framework == 'angular'
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress

  # ---- Aggregate gate: single required check that fans in all MFE suites ----
  # Provides one status to make required without listing every matrix leg.
  frontend-all:
    name: Frontend all suites
    needs: frontend
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify every MFE suite passed
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more MFE test suites failed."
            exit 1
          fi
          echo "All MFE test suites passed."
