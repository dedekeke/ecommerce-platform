# TEMPLATE ONLY — This workflow will not execute until GitHub Actions is enabled
# for this repository.  Enable it by pushing to a branch and opening a PR once
# GitHub Actions has been activated in Settings → Actions.
#
# To activate locally for testing, install 'act' (https://github.com/nektos/act)
# and run: act -W .github/workflows/quality.yml

name: Quality Gate

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  # ─── React MFE unit + coverage ─────────────────────────────────────────────
  react-unit-tests:
    name: React MFE Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - frontend/shell-app
          - frontend/product-catalog-mfe
          - frontend/cart-mfe
          - frontend/checkout-mfe

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.package }}/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: ${{ matrix.package }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: ${{ matrix.package }}/coverage/

  # ─── Angular MFE unit + coverage ───────────────────────────────────────────
  angular-unit-tests:
    name: Angular MFE Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - frontend/user-dashboard-mfe
          - frontend/admin-dashboard-mfe

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.package }}/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}

      - name: Run Angular tests with coverage
        run: npx ng test --code-coverage --watch=false --browsers=ChromeHeadless
        working-directory: ${{ matrix.package }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: ${{ matrix.package }}/coverage/

  # ─── Playwright E2E + accessibility ────────────────────────────────────────
  e2e:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    needs: [react-unit-tests, angular-unit-tests]

    services:
      # The full microservice stack would be started here via docker-compose.
      # Uncomment and adapt once docker-compose.yml targets are stable.
      #
      # postgres:
      #   image: postgres:15
      #   env:
      #     POSTGRES_USER: ecommerce
      #     POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      #     POSTGRES_DB: ecommerce
      #   ports:
      #     - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install shell-app dependencies
        run: npm ci
        working-directory: frontend/shell-app

      - name: Start shell-app (preview)
        run: |
          npm run build
          npm run preview &
        working-directory: frontend/shell-app

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright E2E tests (chromium only in CI)
        run: npx playwright test --project=chromium
        working-directory: e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
