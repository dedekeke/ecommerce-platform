name: Quality

# Pre-merge quality gate for the develop integration branch.
# Backend build + tests (JaCoCo), OWASP dependency-check gate, and every
# micro-frontend test suite. Mirror this locally with `scripts/ci-local.sh`.

on:
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'k8s/**'
      - 'helm/**'
      - 'monitoring/**'
  push:
    branches: [ develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'k8s/**'
      - 'helm/**'
      - 'monitoring/**'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22.12.0"

jobs:
  # ---- Backend: build + unit tests with JaCoCo coverage ----
  backend:
    name: Backend build, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Single pass: compile, run tests, and emit JaCoCo reports. JaCoCo
      # prepare-agent + report are bound in the parent pom pluginManagement,
      # so `install` already produces target/site/jacoco per module.
      - name: Build, test & JaCoCo
        run: mvn -B -ntp clean install
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
          retention-days: 7

  # ---- Preflight: detect whether the NVD API key secret is configured ----
  # The OWASP gate downloads the NVD database. Since ~2023 the NVD API rejects
  # unauthenticated/throttled clients with HTTP 403, so without an NVD_API_KEY the
  # update step fails outright (NoDataException) — that's an infrastructure
  # failure, not a vulnerability finding, and must not red-wall every PR. We
  # therefore run the gate ONLY when the key is present (it runs for real on the
  # canonical pipeline once the secret is set), and otherwise skip it loudly.
  secrets-preflight:
    name: Secrets preflight
    runs-on: ubuntu-latest
    outputs:
      has_nvd_key: ${{ steps.check.outputs.has_nvd_key }}
    steps:
      - id: check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "has_nvd_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_nvd_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=OWASP dependency-check skipped::NVD_API_KEY secret is not set. The OWASP gate is skipped because the NVD API rejects unauthenticated requests (HTTP 403). Add NVD_API_KEY under Settings > Secrets and variables > Actions to enable the security gate."
          fi

  # ---- Security: OWASP dependency-check gate (failBuildOnCVSS=7.0 from pom) ----
  dependency-check:
    name: OWASP dependency-check
    needs: secrets-preflight
    if: needs.secrets-preflight.outputs.has_nvd_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Cache the NVD database between runs so the gate stays fast.
      # Path must match <dataDirectory> pinned in pom.xml (dependency-check 9.x).
      # Key is scoped to the plugin version (DB schema changes across majors),
      # not pom hashes, so dependency edits don't invalidate the NVD cache.
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: nvd-${{ runner.os }}-dc9.2.0
          restore-keys: |
            nvd-${{ runner.os }}-
      - name: Run dependency-check (-Psecurity verify, CVSS >= 7.0 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp -Psecurity -DskipTests verify \
            -Dnvd.api.key=$NVD_API_KEY
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.sarif
          if-no-files-found: ignore
          retention-days: 14

  # ---- Frontend: run every MFE's test suite (matrix per app) ----
  # React/Vite MFEs use vitest; Angular MFEs use ng test (ChromeHeadless).
  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: shell-app,            framework: react }
          - { app: product-catalog-mfe,  framework: react }
          - { app: cart-mfe,             framework: react }
          - { app: checkout-mfe,         framework: react }
          - { app: user-dashboard-mfe,   framework: angular }
          - { app: admin-dashboard-mfe,  framework: angular }
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package.json
      # Angular MFEs run Karma against a real headless Chrome; install one and
      # expose it to Karma via CHROME_BIN. React MFEs use jsdom/happy-dom and
      # don't need a browser.
      - name: Set up Chrome (Angular)
        if: matrix.framework == 'angular'
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Export CHROME_BIN (Angular)
        if: matrix.framework == 'angular'
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # Lockfiles are gitignored in this repo (see .gitignore), so there is no
      # package-lock.json to drive `npm ci`; use `npm install` directly.
      - name: Install
        run: npm install
      # Dependency scan for the frontend. Reported but NON-BLOCKING: lockfiles are
      # gitignored repo-wide, so deps are re-resolved on every run and `npm audit`
      # is non-deterministic — and several advisories are in unfixable transitive
      # build-tooling deps (vite/esbuild/rollup) or test-only deps (happy-dom).
      # Letting those permanently red-wall every PR adds no security value, so the
      # advisories are surfaced as warnings. Re-enable blocking once lockfiles are
      # committed and the audit is deterministic.
      - name: Audit dependencies (report only)
        run: npm audit --audit-level=high || echo "::warning title=npm audit findings::High/critical advisories present; review the log. Non-blocking until lockfiles are committed."
      # Lint is reported but non-blocking: it was historically unenforced (most
      # MFEs ship no eslint.config.js) and the test suites are the gate of record.
      - name: Lint (report only)
        run: npm run lint --if-present || echo "::warning title=Lint findings::Lint reported issues; see log. Non-blocking."
      - name: Test (React / vitest)
        if: matrix.framework == 'react'
        run: npm test --if-present -- --run
      - name: Test (Angular / ng)
        if: matrix.framework == 'angular'
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --no-progress

  # ---- Aggregate gate: single required check that fans in all MFE suites ----
  # Provides one status to make required without listing every matrix leg.
  frontend-all:
    name: Frontend all suites
    needs: frontend
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify every MFE suite passed
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more MFE test suites failed."
            exit 1
          fi
          echo "All MFE test suites passed."
